# mkdocs-base.yml
#
# Shared configuration inherited by the per-version configs:
#   mkdocs.yml    -> v1 docs (docs/v1/)
#   mkdocs-v2.yml -> v2 docs (docs/v2/)
#
# Versions are deployed with mike (one site snapshot per version, selected
# via the header dropdown). See .github/workflows/docs.yml. Local preview:
#   uv run mkdocs serve                    # v1
#   uv run mkdocs serve -f mkdocs-v2.yml   # v2
site_name: FastFuels SDK Documentation
# site_url is required for mike's version selector to keep the reader on
# the same page when switching versions
site_url: https://silvxlabs.github.io/fastfuels-sdk-python/

theme:
  name: "material"
  features:
    - content.code.copy

extra:
  version:
    provider: mike
    alias: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            docstring_section_style: table
            docstring_options:
              ignore_init_summary: true
            show_root_heading: true
            show_source: false
            members_order: source
            annotations_path: brief
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css
