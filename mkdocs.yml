# mkdocs.yml
#
# One docs tree: the root sections document the v1 SDK (the current
# default interface); the "v2 (Beta)" section documents the v2
# subpackage shipping alongside it. Site versions are point-in-time
# release snapshots deployed by mike from .github/workflows/docs.yml on
# each GitHub release — the header selector lists releases (e.g. 0.21)
# with the `latest` alias as the default. Old snapshots are never
# rebuilt. Local preview:
#   uv run mkdocs serve
site_name: FastFuels SDK Documentation
# site_url is required for mike's version selector to keep the reader on
# the same page when switching versions
site_url: https://silvxlabs.github.io/fastfuels-sdk-python/

repo_url: https://github.com/silvxlabs/fastfuels-sdk-python
repo_name: silvxlabs/fastfuels-sdk-python

nav:
  - Home: index.md
  - How-To Guides:
      - Authentication: guides/authentication.md
      - Domains: guides/domains.md
      - Inventories: guides/inventories.md
      - Point Clouds: guides/point_clouds.md
      - Features: guides/features.md
      - Grids: guides/grids.md
  - Tutorials:
      - Export to QUIC-Fire: tutorials/export_to_quicfire.md
      - ALS Point Cloud: tutorials/point_cloud_example.md
  - Reference: reference.md
  - v2 (Beta):
      - Overview: v2/index.md
      - Migrating from v1: v2/guides/migration.md
      - Domains: v2/guides/domains.md
      - Features: v2/guides/features.md
      - Reference: v2/reference.md

theme:
  name: "material"
  icon:
    repo: fontawesome/brands/github
  palette:
    # Palette toggle: light mode -> dark mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle: dark mode -> light mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips

extra:
  version:
    provider: mike
    alias: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/silvxlabs/fastfuels-sdk-python
      name: FastFuels SDK on GitHub

copyright: Copyright &copy; Silvx Labs

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            docstring_section_style: table
            docstring_options:
              ignore_init_summary: true
            show_root_heading: true
            show_source: false
            members_order: source
            annotations_path: brief
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  # PyMdown Extensions
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
